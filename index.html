<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <title>肌腱控制</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar"><h1>肌腱控制</h1></header>
    <div class="layout">
      <section class="stage" id="stage" aria-label="骨骼与肌腱通道">
        <canvas id="canvas" aria-label="三维手部骨骼与肌腱"></canvas>
        <svg id="path-labels" aria-label="肌腱通道标注"></svg>
        <div class="model-error" id="model-error" role="alert" hidden>模型加载失败</div>
      </section>
      <aside class="sidebar" aria-label="关节控制">
        <div class="panel-heading"><h2>活动关节</h2><span class="joint-count">16</span></div>
        <div id="joint-list"></div>
      </aside>
    </div>
  </main>
</body>
</html>
